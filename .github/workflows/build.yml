name: Unzip and Build Signed AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Source File
        run: |
          unzip -o "*.zip" -d extracted_source
          ls -la extracted_source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release AAB & APK
        working-directory: ./extracted_source/StudyQuizMaster
        run: |
          gradle bundleRelease assembleRelease

      - name: Upload Final AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyQuizMaster-Final-Files
          path: |
            extracted_source/StudyQuizMaster/app/build/outputs/bundle/release/*.aab
            extracted_source/StudyQuizMaster/app/build/outputs/apk/release/*.apk
