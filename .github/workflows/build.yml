name: Unzip and Build Signed AAB (API 36 - V5)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip and Update SDK to 36 & Version 5
        run: |
          unzip -o "*.zip" -d extracted_source
          cd extracted_source/StudyQuizMaster
          sed -i 's/compileSdk 34/compileSdk 36/g' app/build.gradle
          sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' app/build.gradle
          sed -i 's/targetSdk 34/targetSdk 36/g' app/build.gradle
          sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' app/build.gradle
          sed -i 's/versionCode 4/versionCode 5/g' app/build.gradle
          sed -i 's/versionName "1.3"/versionName "1.4"/g' app/build.gradle
          sed -i '/READ_MEDIA_IMAGES/d' app/src/main/AndroidManifest.xml
          sed -i '/READ_MEDIA_VIDEO/d' app/src/main/AndroidManifest.xml
          sed -i '/READ_EXTERNAL_STORAGE/d' app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release AAB & APK
        working-directory: ./extracted_source/StudyQuizMaster
        run: |
          gradle bundleRelease assembleRelease

      - name: Upload Final AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyQuizMaster-API36-V5
          path: |
            extracted_source/StudyQuizMaster/app/build/outputs/bundle/release/*.aab
            extracted_source/StudyQuizMaster/app/build/outputs/apk/release/*.apk
